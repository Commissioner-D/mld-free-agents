name: Tmp Schedule
on:
  push:
    branches: [tmp-schedule]
    paths: [.github/workflows/tmp-schedule.yml]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          mkdir -p dl
          for p in "" settings rules trades transactions; do
            curl -s -L -A "Mozilla/5.0" "https://www.fleaflicker.com/nfl/leagues/294292/$p" > "dl/page_${p:-home}.html"; sleep 2
          done
          curl -s -A "mld-fa/1.0" "https://www.fleaflicker.com/api/FetchLeagueRules?sport=NFL&league_id=294292" > dl/rules.json
          curl -s -A "mld-fa/1.0" "https://www.fleaflicker.com/api/FetchTrades?sport=NFL&league_id=294292&filter=TRADES_COMPLETED" > dl/trades.json
          git config user.name github-actions; git config user.email actions@github.com
          git add dl && git commit -q -m "tmp pages" && git push -q origin HEAD:tmp-schedule
