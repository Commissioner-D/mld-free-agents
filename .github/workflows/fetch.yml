name: Fetch Free Agents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch.py, league.py, .github/workflows/fetch.yml]
  schedule:
    - cron: "0 */4 * * *"   # alle 4 Stunden (UTC). GitHub startet oft 5-30 min verspaetet.

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Keep last good league.json
        run: curl -sf https://raw.githubusercontent.com/${{ github.repository }}/data/data/league.json -o /tmp/league_prev.json || true
      - name: Probe trades page
        run: |
          curl -s -A "Mozilla/5.0" https://www.fleaflicker.com/nfl/leagues/294292/trades -o /tmp/tp.html; echo "HTML $(wc -c < /tmp/tp.html)"
          grep -oiE "(pending|under review|in review|veto|accepted|proposed|tradestatus|TRADE_STATUS_[A-Z_]+|filter=[A-Z_]+)[^<]{0,40}" /tmp/tp.html | sort | uniq -c | head -40 > /tmp/tp_probe.txt; cat /tmp/tp_probe.txt
      - name: Fetch
        run: python fetch.py 2>&1 | tee fetch_log.txt; exit ${PIPESTATUS[0]}
      - name: Publish to data branch (overwrite, no history growth)
        run: |
          mkdir -p /tmp/out && cp data/free_agents.json /tmp/out/ && (cp data/league.json /tmp/out/ || cp /tmp/league_prev.json /tmp/out/league.json || true) && cp fetch_log.txt /tmp/out/ && (cp /tmp/tp_probe.txt /tmp/out/ || true)
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan data-tmp
          git rm -rf --cached . -q
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir data && cp /tmp/out/* data/
          git add data
          git commit -q -m "FA data $(date -u +%Y-%m-%d_%H%M)"
          git push -f origin HEAD:data
