name: Fetch Free Agents

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"   # taeglich 05:00 UTC, wird an Waiver-Zeit angepasst

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch
        run: python fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "FA update $(date -u +%Y-%m-%d_%H%M)" || exit 0
          git fetch origin main
          git reset --soft origin/main
          git commit -m "FA update $(date -u +%Y-%m-%d_%H%M)" || exit 0
          git push
