name: Fetch Free Agents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch.py, league.py, .github/workflows/fetch.yml]
  schedule:
    - cron: "0 */4 * * *"   # alle 4 Stunden (UTC). GitHub startet oft 5-30 min verspaetet.

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch
        run: python fetch.py 2>&1 | tee fetch_log.txt; exit ${PIPESTATUS[0]}
      - name: Publish to data branch (overwrite, no history growth)
        run: |
          mkdir -p /tmp/out && cp data/free_agents.json /tmp/out/ && (cp data/league.json /tmp/out/ || true) && cp fetch_log.txt /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan data-tmp
          git rm -rf --cached . -q
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir data && cp /tmp/out/* data/
          git add data
          git commit -q -m "FA data $(date -u +%Y-%m-%d_%H%M)"
          git push -f origin HEAD:data
