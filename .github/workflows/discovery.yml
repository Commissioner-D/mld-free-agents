name: API Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch test
        run: python discovery.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -q --cached discovery/fa_test*.json discovery/standings_noua.json 2>/dev/null || true
          rm -f discovery/fa_test*.json discovery/standings_noua.json
          git add -A discovery
          git commit -m "API discovery v3" || echo "nothing to commit"
          git push
