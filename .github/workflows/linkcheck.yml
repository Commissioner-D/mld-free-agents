name: Linkcheck
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.fleaflicker.com/nfl/leagues/294292/players/8800" "https://www.fleaflicker.com/nfl/players/8800" "https://www.fleaflicker.com/nfl/leagues/294292/players/8800/case-keenum" "https://www.fleaflicker.com/nfl/players/8800/case-keenum" "https://www.fleaflicker.com/nfl/leagues/294292/players?playerId=8800" ; do
            code=$(curl -sL -A "mld-fa/1.0" -o p.html -w "%{http_code} %{url_effective}" "$u")
            t=$(grep -o "<title>[^<]*" p.html | head -1)
            k=$(grep -c "Keenum" p.html)
            echo "RES $u => $code | $t | keenum=$k"
          done
          curl -s -A "mld-fa/1.0" "https://www.fleaflicker.com/nfl/leagues/294292/players?statType=1" | grep -o 'href="[^"]*players/[0-9][^"]*"' | head -5 | sed 's/^/HREF /'
