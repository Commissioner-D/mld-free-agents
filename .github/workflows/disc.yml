name: Discovery
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          mkdir out
          python3 - << 'EOF'
          import urllib.request, json
          B = "https://www.fleaflicker.com/api/FetchPlayerListing?sport=NFL&league_id=294292"
          res = {}
          for name, q in [("sorted0", "&sort=SORT_SEASON_TOTAL&result_offset=0"),
                          ("sorted600", "&sort=SORT_SEASON_TOTAL&result_offset=600"),
                          ("plain0", "&result_offset=0"), ("plain600", "&result_offset=600"),
                          ("fa0", "&filter.free_agent_only=true&sort=SORT_SEASON_TOTAL")]:
              d = json.loads(urllib.request.urlopen(urllib.request.Request(B + q, headers={"User-Agent": "mld-fa/1.0"}), timeout=30).read())
              ps = d.get("players", [])
              res[name] = {"total": d.get("resultTotal"), "next": d.get("resultOffsetNext"), "n": len(ps),
                           "owned": sum(1 for p in ps if p.get("owner")),
                           "first": [(p["proPlayer"]["nameFull"], (p.get("owner") or {}).get("name")) for p in ps[:4]]}
          open("out/res.json", "w").write(json.dumps(res, indent=1))
          EOF
          git config user.name a; git config user.email a@a
          git checkout --orphan disc; git rm -rf --cached . -q; git add out; git commit -qm d; git push -f origin HEAD:disc
