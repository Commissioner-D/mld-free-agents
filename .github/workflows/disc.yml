name: Discovery
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          set +e
          mkdir out; B="https://www.fleaflicker.com/api"; UA="mld-fa/1.0"
          curl -s -A $UA "$B/FetchRoster?sport=NFL&league_id=294292&team_id=1476731" -o out/roster.json
          curl -s -A $UA "$B/FetchPlayerListing?sport=NFL&league_id=294292&filter.owner=1476731" -o out/owner.json
          curl -s -A $UA "$B/FetchPlayerListing?sport=NFL&league_id=294292&filter.query=Jayden%20Daniels" -o out/query.json
          git config user.name a; git config user.email a@a
          git checkout --orphan disc; git rm -rf --cached . -q; git add out; git commit -qm d; git push -f origin HEAD:disc
